name: Mutinynet Backend E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  mutinynet-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: NArkNut/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cdk-arkade-payment-processor:local
          cache-from: type=gha,scope=processor
          cache-to: type=gha,mode=max,scope=processor

      - name: Pull CDK mintd image
        run: docker pull cashubtc/mintd:0.17.0-rc.0

      - name: Prepare env file
        run: |
          cat > .env.ci <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          PROCESSOR_WALLET_SECRET=abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about
          CDK_MINTD_MNEMONIC=monkey chase banana monkey chase banana monkey chase banana monkey chase wrong
          CDK_MINTD_MINT_NAME=Arkade CI Mint
          EOF

      - name: Start mutinynet stack
        run: docker compose -f compose.mutinynet.yaml --env-file .env.ci up -d
        timeout-minutes: 3

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --http2-prior-knowledge http://localhost:8080/ >/dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            sleep 2
          done
          curl -fsS --http2-prior-knowledge http://localhost:8080/

      - name: Wait for CDK mintd
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3338/v1/info >/dev/null 2>&1; then
              echo "CDK mint ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3338/v1/info

      - name: Run C# tests
        run: dotnet test NArkNut.Tests/NArkNut.Tests.csproj --configuration Release --verbosity normal
        timeout-minutes: 15
        env:
          RUN_REGTEST_INTEGRATION: "1"

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f compose.mutinynet.yaml logs --no-color cdk-arkade-payment-processor > /tmp/processor-logs.txt 2>&1 || true
          docker compose -f compose.mutinynet.yaml logs --no-color cdk-mintd > /tmp/mintd-logs.txt 2>&1 || true
          docker compose -f compose.mutinynet.yaml logs --no-color postgres > /tmp/postgres-logs.txt 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            /tmp/processor-logs.txt
            /tmp/mintd-logs.txt
            /tmp/postgres-logs.txt

      - name: Cleanup
        if: always()
        run: docker compose -f compose.mutinynet.yaml --env-file .env.ci down -v --remove-orphans || true
